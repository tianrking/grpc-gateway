name: Engineer 04 field mask baseline and fixed native quality
on:
  push:
    branches: [codex/native-fieldmask-quality]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: helper
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c9c2765f7df366c9bd8d95de1568aff59341802b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c4f83bea97976ca1f7f84469425b37ca6765bfef
          path: fixed
          persist-credentials: false
      - name: Retain exact pre-generation source hashes
        run: python3 helper/.github/engineer04-fieldmask-quality-evidence.py before
      - name: Actual anonymous pinned public image pull
        run: |
          mkdir -p evidence
          set +e
          docker pull ghcr.io/grpc-ecosystem/grpc-gateway/build-env@sha256:368299810949d0d4c796f171b18f6e5def481feb7b3fddbece2ab827148c0312 > evidence/image-pull.stdout 2> evidence/image-pull.stderr
          code=$?
          echo "$code" > evidence/image-pull.exit
          docker image inspect ghcr.io/grpc-ecosystem/grpc-gateway/build-env@sha256:368299810949d0d4c796f171b18f6e5def481feb7b3fddbece2ab827148c0312 > evidence/image-inspect.json
          exit "$code"
      - name: Actual baseline then fixed same-image quality commands
        run: |
          for source in baseline fixed; do
            mkdir -p "evidence/$source"
            docker run --rm \
              -v "$PWD/$source:/workspace" \
              -v "$PWD/evidence/$source:/evidence" \
              -v "$PWD/helper/.github:/helper:ro" \
              -v fieldmask-go-cache:/root/.cache/go-build \
              -v fieldmask-go-mod:/go/pkg/mod \
              -v fieldmask-bazel-cache:/root/.cache/bazel \
              -w /workspace \
              ghcr.io/grpc-ecosystem/grpc-gateway/build-env@sha256:368299810949d0d4c796f171b18f6e5def481feb7b3fddbece2ab827148c0312 \
              /bin/bash /helper/engineer04-fieldmask-quality.sh
          done
      - name: Preserve results and final exact source identities
        if: always()
        run: |
          python3 helper/.github/engineer04-fieldmask-quality-evidence.py after
          python3 helper/.github/engineer04-fieldmask-quality-evidence.py results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fieldmask-baseline-fixed-quality
          path: evidence/
          retention-days: 30
