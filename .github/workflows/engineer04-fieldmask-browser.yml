name: Engineer 04 existing browser baseline and fixed
on:
  push:
    branches: [codex/native-fieldmask-browser]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: helper
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c9c2765f7df366c9bd8d95de1568aff59341802b
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c4f83bea97976ca1f7f84469425b37ca6765bfef
          path: fixed
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
          cache-dependency-path: fixed/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: python3 helper/.github/engineer04-fieldmask-quality-evidence.py before
      - name: Actual existing Playwright/Jasmine browser suite
        run: |
          mkdir -p evidence/browser
          node --version > evidence/browser/node-version.txt
          npm --version > evidence/browser/npm-version.txt
          go version > evidence/browser/go-version.txt
          set +e
          for source in baseline fixed; do
            (cd "$source/examples/internal/browser" && npm ci) > "evidence/browser/$source-install.stdout" 2> "evidence/browser/$source-install.stderr"
            echo "$?" > "evidence/browser/$source-install.exit"
            (cd "$source/examples/internal/browser" && npm ls --depth=0) > "evidence/browser/$source-tool-versions.stdout" 2> "evidence/browser/$source-tool-versions.stderr"
            echo "$?" > "evidence/browser/$source-tool-versions.exit"
            (cd "$source/examples/internal/browser" && ./node_modules/.bin/gulp) > "evidence/browser/$source-tests.stdout" 2> "evidence/browser/$source-tests.stderr"
            echo "$?" > "evidence/browser/$source-tests.exit"
          done
          exit 0
      - name: Record source preservation and actual command outcomes
        if: always()
        run: |
          python3 helper/.github/engineer04-fieldmask-quality-evidence.py after
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('evidence/browser')
          results = {p.stem: int(p.read_text()) for p in root.glob('*.exit')}
          (root / 'summary.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          if len(results) != 6 or any(results.values()):
              raise SystemExit('Actual browser install/build/suite failed; keep baseline/fixed raw logs')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fieldmask-baseline-fixed-browser
          path: evidence/
          retention-days: 30
